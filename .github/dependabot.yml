version: 2
updates:
  - package-ecosystem: npm
    directory: /skills/job-board
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # vitest 5 supports Node 22.12 and newer; the skill and its CI support Node 20.
      # Revisit when Node 20 is dropped.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
