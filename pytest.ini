# Root config so `pytest` works across every skill in this repo.
#
# Per-skill pytest.ini is ignored when running from the root, which previously
# produced "Unknown pytest.mark.live" warnings. Markers are registered here so
# they apply to all skills; add new markers to this list.
#
# Test files must be uniquely named across skills (see README conventions) —
# pytest collects them into one flat namespace.
[pytest]
markers =
    live: hits real network endpoints; enable with the skill's own opt-in env var
