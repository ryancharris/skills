[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch-skill"
version = "1.1.0"
description = "Find open roles, or check whether a company is hiring, by reading its ATS job board directly."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Runtime is deliberately stdlib-only so the skill stays copyable on its own.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes>=3"]

[project.scripts]
jobsearch = "jobsearch.cli:main"

[tool.setuptools]
packages = ["jobsearch", "jobsearch.ats", "jobsearch.search"]
